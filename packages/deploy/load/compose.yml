# The built container behind a local Caddy, for the load test only. Plain HTTP, nothing here is for real use.
services:
  clocktower:
    build:
      context: ../../..
      dockerfile: packages/deploy/Dockerfile
    read_only: true
    tmpfs: ['/tmp']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    environment:
      - SITE_PASSWORD=load-test
      - TRUST_PROXY=caddy
      - LOG_LEVEL=warn
    volumes:
      - load-data:/data

  caddy:
    image: caddy:2-alpine
    ports:
      - '127.0.0.1:18080:8080'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [clocktower]

volumes:
  load-data:
