# Clocktower: the app and Caddy on the existing hostname. This replaces the old stack. See README.md here.
name: clocktower
services:
  clocktower:
    # The newest release. Roll back by setting CLOCKTOWER_IMAGE_TAG in .env to an earlier tag.
    image: ghcr.io/arkinect/clocktower:${CLOCKTOWER_IMAGE_TAG:-latest}
    container_name: clocktower
    restart: unless-stopped
    user: '1000:1000'
    read_only: true
    tmpfs: ['/tmp']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    pids_limit: 200
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - DEFAULT_GAME_CODE=default
      - PUBLIC_URL=https://${CLOCKTOWER_DOMAIN:?set CLOCKTOWER_DOMAIN in .env}
      - SITE_PASSWORD=${CLOCKTOWER_SITE_PASSWORD:?set CLOCKTOWER_SITE_PASSWORD in .env}
      # Only this peer's X-Forwarded-For is believed. The name is resolved again every minute.
      - TRUST_PROXY=${CLOCKTOWER_TRUST_PROXY:-caddy}
      # Off unless you set HSTS=1 in .env. It would bind every port on this host name to HTTPS.
      - HSTS=${HSTS:-0}
    volumes:
      # Never ./data: the old app's file there has the same name and different tables.
      - ${CLOCKTOWER_DATA:-clocktower-data}:/data
    networks: [clocktower]
    # No published port: only Caddy can reach the app.

  caddy:
    image: caddy:2-alpine
    container_name: clocktower-caddy
    restart: unless-stopped
    user: '1000:1000'
    cap_drop: [ALL]
    # The caddy binary carries the bind-ports file capability; it must be in the bounding set or exec fails.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    environment:
      - CLOCKTOWER_DOMAIN=${CLOCKTOWER_DOMAIN}
    ports:
      # Caddy runs unprivileged on high ports inside the container. Change the host side
      # (e.g. "8444:8443") if 80/443 are taken, and forward your router's external ports to them.
      - '80:8080'
      - '443:8443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Must be writable by uid 1000: mkdir -p caddy/data caddy/config && sudo chown -R 1000:1000 caddy
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks: [clocktower]
    depends_on: [clocktower]

networks:
  clocktower:
    name: clocktower

volumes:
  clocktower-data:
    name: clocktower-data
