name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run boundaries
      - run: npm run boundaries:selftest
      - run: npm run check:role-ids
      # With coverage, held to the floors in each package's vitest config. The nightly 10,000 games run without it.
      - run: npm run ${{ github.event_name == 'schedule' && 'test' || 'test:coverage' }}
        env:
          # 500 games on every push, 10,000 at night.
          FUZZ_GAMES: ${{ github.event_name == 'schedule' && '10000' || '500' }}
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w @ct/web
      - run: npm audit --omit=dev
      - run: docker build -t clocktower:ci .
      - run: docker compose config --quiet
        env:
          CLOCKTOWER_DOMAIN: clocktower.example.com
          CLOCKTOWER_SITE_PASSWORD: ci-only
