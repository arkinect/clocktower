name: Rewrite CI

on:
  push:
    paths: ['packages/**', '.github/workflows/rewrite.yml']
  pull_request:
    paths: ['packages/**', '.github/workflows/rewrite.yml']
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run boundaries
      - run: npm run boundaries:selftest
      - run: npm run check:role-ids
      - run: npm run test
        env:
          FUZZ_GAMES: ${{ github.event_name == 'schedule' && '10000' || '500' }}
      - run: npm run build
      - run: npm audit --omit=dev
