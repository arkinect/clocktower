name: Weekly image refresh

# Rebuilds the newest release tag on fresh base images and republishes it, so security patches in Node/Debian
# reach :latest without a new release. Tuesdays 06:00 UTC; can also be run by hand from the Actions tab.
# Note: GitHub pauses scheduled workflows after 60 days without repository activity (re-enable in the Actions tab).
on:
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        name: Find the newest release tag
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$tag" ]; then echo "No release tag yet, nothing to refresh."; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: steps.tag.outputs.tag != ''
        run: git checkout "${{ steps.tag.outputs.tag }}"
      - if: steps.tag.outputs.tag != ''
        uses: docker/setup-qemu-action@v3
      - if: steps.tag.outputs.tag != ''
        uses: docker/setup-buildx-action@v3
      - if: steps.tag.outputs.tag != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.tag.outputs.tag != ''
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/clocktower
          tags: |
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.tag }}
            type=raw,value=latest
      - if: steps.tag.outputs.tag != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
