name: Publish rewrite image

# All from packages/deploy/Dockerfile, as ghcr.io/arkinect/clocktower:
#   - every push to main     -> :next and :sha-<commit>
#   - every tag v1.2.3       -> :1.2.3 and :latest
#   - Tuesdays 06:00 UTC     -> the newest tag rebuilt on fresh base images, so patches reach :latest with no release
# The release job waits for cutover: while release.yml or refresh.yml exist they own those tags and build the old app.
# Note: GitHub pauses scheduled workflows after 60 days without repository activity (re-enable in the Actions tab).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["packages/**", "shared/**", ".github/workflows/next.yml"]
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/clocktower:next
            ghcr.io/${{ github.repository_owner }}/clocktower:sha-${{ github.sha }}
          build-args: BUILD_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: github.event_name != 'push' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        name: Find the tag to build
        env:
          EVENT: ${{ github.event_name }}
          PUSHED: ${{ github.ref_name }}
        run: |
          if [ -e .github/workflows/release.yml ] || [ -e .github/workflows/refresh.yml ]; then
            if [ "$EVENT" = push ]; then
              echo "::error::Delete release.yml and refresh.yml before tagging a release. See packages/deploy/README.md."
              exit 1
            fi
            echo "The old release workflows are still here, nothing to rebuild."
            exit 0
          fi
          if [ "$EVENT" = push ]; then tag=$PUSHED; else tag=$(git tag --list 'v*' --sort=-v:refname | head -n1); fi
          if [ -z "$tag" ]; then echo "No release tag yet, nothing to rebuild."; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: steps.tag.outputs.tag != ''
        id: checkout
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git checkout "$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - if: steps.tag.outputs.tag != ''
        uses: docker/setup-qemu-action@v3
      - if: steps.tag.outputs.tag != ''
        uses: docker/setup-buildx-action@v3
      - if: steps.tag.outputs.tag != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.tag.outputs.tag != ''
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/clocktower
          tags: |
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.tag }}
            type=raw,value=latest
          flavor: latest=false
      - if: steps.tag.outputs.tag != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: BUILD_ID=${{ steps.checkout.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
