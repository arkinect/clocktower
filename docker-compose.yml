# Clocktower Night Assistant: internet-facing deployment.
#   1. cp .env.example .env   and fill in CLOCKTOWER_DOMAIN and CLOCKTOWER_SITE_PASSWORD
#   2. Point your domain's DNS at this machine and forward TCP 80 + 443 to it
#   3. docker compose up -d
# Caddy obtains and renews a Let's Encrypt certificate automatically.
# For a LAN-only setup without Caddy, see "Run it on your LAN" in the README.
services:
  clocktower:
    image: ghcr.io/arkinect/clocktower:latest
    # To build from source instead of pulling the published image, uncomment:
    # build: .
    container_name: clocktower
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 200
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - DEFAULT_GAME_CODE=default
      - PUBLIC_URL=https://${CLOCKTOWER_DOMAIN:?set CLOCKTOWER_DOMAIN in .env}
      - SITE_PASSWORD=${CLOCKTOWER_SITE_PASSWORD:?set CLOCKTOWER_SITE_PASSWORD in .env}
      - TRUST_PROXY=1
    volumes:
      # Must be writable by uid 1000: mkdir -p data && sudo chown 1000:1000 data
      - ./data:/data
    networks: [clocktower]
    # No published port: only Caddy can reach the app.

  caddy:
    image: caddy:2-alpine
    container_name: clocktower-caddy
    restart: unless-stopped
    user: "1000:1000"
    cap_drop: [ALL]
    # The caddy binary carries the bind-ports file capability; it must be in the bounding set or exec fails.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    environment:
      - CLOCKTOWER_DOMAIN=${CLOCKTOWER_DOMAIN}
    ports:
      # Caddy runs unprivileged on high ports inside the container. Change the host side
      # (e.g. "8444:8443") if 80/443 are taken, and forward your router's external ports to them.
      - "80:8080"
      - "443:8443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Must be writable by uid 1000: mkdir -p caddy/data caddy/config && sudo chown -R 1000:1000 caddy
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks: [clocktower]
    depends_on: [clocktower]

networks:
  clocktower:
    name: clocktower
